try{var d=await (window.claude&&window.claude.use?window.claude.use("downloads"):null);
if(!d){m.textContent="Downloads aren't available in this view. Open the page in the Claude app or claude.ai to save the PDF.";return}
var bin=atob(PDF64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
await d.save({filename:"Scientific_Facts_in_the_Bible.pdf",data:new Blob([u],{type:"application/pdf"})})}
catch(e){if(!e||e.code!=="declined")m.textContent="Couldn't save the PDF ("+((e&&e.code)||"error")+").";}
};
</script>
